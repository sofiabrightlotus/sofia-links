<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sofía — Links</title>
<meta name="description" content="Sofía's links — social, projects, videos, and blog posts." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Radley&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="page">
    <header class="profile">
      <img class="avatar" src="images/avatar-lotus.png" alt="Lotus flower" onerror="this.src='images/avatar-placeholder.svg'" />
      <h1 class="name">Sofía</h1>
      <p class="bio">Building things, sharing what I learn. Links, videos, and posts below.</p>

      <nav class="socials" id="socials" aria-label="Social links"></nav>
      <p class="socials-label">My socials</p>
    </header>

    <section class="section" aria-labelledby="links-heading">
      <h2 id="links-heading" class="section-title">Links</h2>
      <div id="links" class="link-list"></div>
    </section>

    <section class="section" aria-labelledby="videos-heading">
      <h2 id="videos-heading" class="section-title">Videos</h2>
      <div id="videos" class="video-grid"></div>
    </section>

    <section class="section" aria-labelledby="blog-heading">
      <h2 id="blog-heading" class="section-title">Blog</h2>
      <div id="blog" class="blog-list"></div>
    </section>

    <footer class="footer">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
      <p>&copy; <span id="year"></span> Sofía</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
