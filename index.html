<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sofía Bright Lotus</title>
<meta name="description" content="Sofía Bright Lotus — skincare and lifestyle creator with a retro-tech aesthetic. Featured reels, socials, and contact for brand collabs." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-photo">
        <video autoplay muted loop playsinline poster="images/hero-photo.jpg">
          <source src="videos/hero.mp4" type="video/mp4" />
        </video>
      </div>
      <div class="hero-panel">
        <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language" title="Switch language">FR</button>

        <img class="hero-flower" src="images/flower-outline.png" alt="" aria-hidden="true" />
        <h1 class="hero-name">Sofía<br />Bright<br />Lotus</h1>

        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-label" data-i18n="statTotalViews">Total views</div>
            <div class="hero-stat-value" id="stat-views">—</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-label" data-i18n="statContact">Contact</div>
            <a class="hero-stat-value hero-stat-value--link" href="mailto:sofia@brightlotus.ca">sofia@brightlotus.ca</a>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-label" data-i18n="statFollowers">Followers</div>
            <div class="hero-stat-value" id="stat-followers">—</div>
          </div>
          <div class="hero-stat">
            <button id="share-btn" class="copy-link-btn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6" /><path d="M10 7l.9-.9a3.5 3.5 0 0 1 5 5l-.9.9" /><path d="M14 17l-.9.9a3.5 3.5 0 0 1-5-5l.9-.9" /></svg>
              <span data-i18n="copyLink">Copy link</span>
            </button>
          </div>
        </div>

        <nav class="hero-socials" id="socials" aria-label="Social links"></nav>
      </div>
    </section>

    <section class="featured">
      <h2 class="block-title" data-i18n="featuredTitle">Featured</h2>
      <div class="featured-strip" id="featured"></div>
    </section>

    <section class="about">
      <div class="about-grid">
        <div class="about-title-card">
          <h2 class="block-title" data-i18n="aboutTitle">About me</h2>
        </div>
        <div class="about-flower">
          <img src="images/about-lotus-photo.png" alt="" aria-hidden="true" />
        </div>
        <div class="about-selfie">
          <video autoplay muted loop playsinline poster="images/about-selfie.jpg" aria-label="Sofía">
            <source src="videos/about-selfie.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="about-text" id="about-text"></div>
        <div class="about-block about-block--empty" aria-hidden="true"></div>
        <div class="about-block about-block--worked" id="about-worked"></div>
        <div class="about-block about-block--quote" id="about-quote"></div>
      </div>
    </section>

    <footer class="footer">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
    </footer>
  </main>

  <span id="share-toast" class="share-toast" role="status" aria-live="polite"></span>

  <script src="script.js"></script>
</body>
</html>
